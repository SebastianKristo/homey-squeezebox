<div class="homey-form">
  <p data-i18n="pair.intro"></p>
  <div id="servers"><p class="hint" data-i18n="pair.searching"></p></div>

  <details id="manual">
    <summary data-i18n="pair.manual"></summary>
    <div class="homey-form-group">
      <label class="homey-form-label" for="host" data-i18n="pair.host"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.10">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="port" data-i18n="pair.port"></label>
      <input class="homey-form-input" id="port" type="number" placeholder="9000">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="username" data-i18n="pair.username"></label>
      <input class="homey-form-input" id="username" type="text" autocomplete="off">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="password" data-i18n="pair.password"></label>
      <input class="homey-form-input" id="password" type="password" autocomplete="off">
    </div>
    <button id="connect" class="homey-button-primary-full" data-i18n="pair.connect"></button>
  </details>
</div>
<style>
  .server { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--homey-color-mono-100, #ddd); border-radius: 10px; background: none; font: inherit; color: inherit; }
  .server small { display: block; opacity: .6; }
  .hint { opacity: .6; }
  #manual { margin-top: 16px; }
  #manual summary { cursor: pointer; margin-bottom: 12px; }
</style>
<script>
  const $ = (id) => document.getElementById(id);
  let uuid = null;
  let name = null;

  function connect(server) {
    $('connect').classList.add('is-loading');
    Homey.emit('add_server', server)
      .then(() => Homey.showView('list_devices'))
      .catch((err) => Homey.alert(err.message || err))
      .finally(() => $('connect').classList.remove('is-loading'));
  }

  Homey.emit('get_servers').then((servers) => {
    const list = $('servers');
    list.innerHTML = '';
    if (!servers.length) {
      list.innerHTML = `<p class="hint">${Homey.__('pair.none_found')}</p>`;
      $('manual').open = true;
    }
    servers.forEach((s) => {
      const b = document.createElement('button');
      b.className = 'server';
      b.innerHTML = `<strong></strong><small></small>`;
      b.querySelector('strong').textContent = s.name;
      b.querySelector('small').textContent = `${s.host}:${s.port}${s.saved ? ' · ' + Homey.__('pair.saved') : ''}`;
      b.onclick = () => {
        if (s.saved) {
          Homey.emit('select_server', s.id).then(() => Homey.showView('list_devices')).catch((e) => Homey.alert(e.message || e));
        } else {
          // Try without a password first; ask for one if the server needs it.
          uuid = s.uuid; name = s.name;
          $('host').value = s.host; $('port').value = s.port;
          Homey.emit('add_server', { uuid, name, host: s.host, port: s.port })
            .then(() => Homey.showView('list_devices'))
            .catch(() => { $('manual').open = true; Homey.alert(Homey.__('pair.needs_login')); });
        }
      };
      list.appendChild(b);
    });
  }).catch((err) => { $('servers').innerHTML = ''; $('manual').open = true; });

  $('host').addEventListener('input', () => { uuid = null; name = null; });
  $('connect').addEventListener('click', () => {
    const host = $('host').value.trim();
    if (!host) return Homey.alert(Homey.__('pair.host_missing'));
    connect({ uuid, name, host, port: $('port').value.trim(), username: $('username').value.trim(), password: $('password').value });
  });
</script>
