<!doctype html>
<html>
<head><script type="text/javascript" src="/homey.js" data-origin="settings"></script></head>
<body>
  <h1 class="homey-title">Lyrion Music Server</h1>
  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group"><label class="homey-form-label" for="host" data-i18n="pair.host"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.10"></div>
    <div class="homey-form-group"><label class="homey-form-label" for="port" data-i18n="pair.port"></label>
      <input class="homey-form-input" id="port" type="number" placeholder="9000"></div>
    <div class="homey-form-group"><label class="homey-form-label" for="username" data-i18n="pair.username"></label>
      <input class="homey-form-input" id="username" type="text" autocomplete="off"></div>
    <div class="homey-form-group"><label class="homey-form-label" for="password" data-i18n="pair.password"></label>
      <input class="homey-form-input" id="password" type="password" autocomplete="off"></div>
  </fieldset>
  <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>
  <script>
    const keys = ['host', 'port', 'username', 'password'];
    function onHomeyReady(Homey) {
      keys.forEach((k) => Homey.get(k, (err, v) => { if (v != null) document.getElementById(k).value = v; }));
      document.getElementById('save').addEventListener('click', () => {
        keys.forEach((k) => Homey.set(k, document.getElementById(k).value.trim()));
        Homey.alert(Homey.__('settings.saved'));
      });
      Homey.ready();
    }
  </script>
</body>
</html>
